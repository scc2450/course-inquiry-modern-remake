services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      COURSE_DATA_DIR: /app/apps/api/data
      COURSE_DATABASE_PATH: /app/apps/api/data/courses.sqlite
      COURSE_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - course-data:/app/apps/api/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  course-data:
